[package]
name = "qrforge"
version = "0.1.0"
edition = "2021"
description = "High-efficiency Rust QR code generator with custom colors, gradients, module styles, center logo embedding, CLI, and embedded local web UI"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
png = "0.17"
qrcodegen = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"

[dev-dependencies]
rqrr = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
